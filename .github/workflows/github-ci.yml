name: GitHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  engine-compat:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/engine-compat.yml
    with:
      node-versions: '22.20.0, 22, 24.0.0, 24'
