name: GitHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  engine-compat:
    name: Engines / Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Border versions of the supported engine range
        node-version: ["22.20.0", "22", "24.0.0", "24"]
    steps:

    - uses: actions/checkout@v6

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Check engine compatibility
      run: |
        mkdir -p /tmp/engine-result
        node --version | tr -d '\n' > /tmp/engine-result/version.txt
        npm ci --dry-run 2>&1 | tee /tmp/engine-result/output.txt
        # Extract unique "package (node requirement)" pairs from EBADENGINE warnings
        awk "
          /EBADENGINE.*package:/ {
            match(\$0, /'[^']*'/)
            pkg = substr(\$0, RSTART+1, RLENGTH-2)
          }
          /EBADENGINE.*required:.*node:/ && pkg {
            match(\$0, /node: *'[^']*'/)
            req = substr(\$0, RSTART+6, RLENGTH-6)
            gsub(/'/, \"\", req)
            sub(/^ +/, \"\", req)
            print pkg \" (node \" req \")\"
            pkg=\"\"
          }
        " /tmp/engine-result/output.txt | sort -u > /tmp/engine-result/packages.txt
        if [ -s /tmp/engine-result/packages.txt ]; then
          echo fail > /tmp/engine-result/status.txt
        else
          echo pass > /tmp/engine-result/status.txt
        fi

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: engine-${{ matrix.node-version }}
        path: /tmp/engine-result/

  engine-report:
    name: Engine report
    needs: engine-compat
    runs-on: ubuntu-24.04
    if: always() && github.event_name == 'pull_request'
    steps:

    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v4
      with:
        pattern: engine-*
        path: results/

    - name: Build and post comment
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        PR="${{ github.event.pull_request.number }}"
        MARKER="<!-- engine-compat -->"
        FAILED=false

        {
          echo "$MARKER"
          echo "## ENGINE_ICON Engine Compatibility"
          echo ""
          echo "| Node | Result | Incompatible Packages |"
          echo "|---|---|---|"
        } > /tmp/table.md

        for dir in results/engine-*/; do
          [ -d "$dir" ] || continue
          VER=$(cat "$dir/version.txt")
          STATUS=$(cat "$dir/status.txt" 2>/dev/null || echo unknown)
          if [ "$STATUS" = pass ]; then
            echo "| $VER | ✅ Pass | — |" >> /tmp/table.md
          else
            FAILED=true
            PKGS="—"
            if [ -s "$dir/packages.txt" ]; then
              PKGS=$(sed 's/|/\\|/g; s/.*/`&`/' "$dir/packages.txt" | tr '\n' ' ' | sed 's/ $//')
            fi
            echo "| $VER | ❌ Fail | $PKGS |" >> /tmp/table.md
          fi
        done

        if [ "$FAILED" = true ]; then ICON="❌"; else ICON="✅"; fi
        sed -i "s/ENGINE_ICON/$ICON/" /tmp/table.md

        cp /tmp/table.md /tmp/comment.md

        OLD=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
          --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id" 2>/dev/null || true)
        if [ -n "$OLD" ] && [ "$OLD" != "null" ]; then
          gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$OLD" -F body=@/tmp/comment.md
        else
          gh pr comment "$PR" --body-file /tmp/comment.md
        fi

        if [ "$FAILED" = true ]; then
          gh label create blocked --color D93F0B 2>/dev/null || true
          gh pr edit "$PR" --add-label blocked
        else
          gh pr edit "$PR" --remove-label blocked 2>/dev/null || true
        fi
