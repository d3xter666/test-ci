name: GitHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  engine-compat:
    if: github.event_name == 'pull_request'
    uses: UI5/cli/.github/workflows/engine-compat.yml@engine-compatibility-checks
    with:
      node-versions: 18, 19, 22.20.0, 22

  engine-compat-own:
    if: github.event_name == 'pull_request'
    uses: UI5/cli/.github/workflows/engine-compat.yml@engine-compatibility-checks-script
